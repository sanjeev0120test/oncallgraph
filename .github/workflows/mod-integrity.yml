name: mod-integrity

# Module graph integrity. Parallel to ci; usually <30s.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: go mod verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Verify module checksums + tidy + no k8s.io
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum
          # Default binary must stay free of k8s.io (live connector is opt-in).
          if go list -deps ./cmd/opsgraph | grep -E '^k8s\.io/'; then
            echo "k8s.io deps leaked into default binary" >&2
            exit 1
          fi
          # CGO must stay off for the main module packages we care about.
          test "${CGO_ENABLED}" = "0"
