name: dependency-review

# PR dependency advisory scan. Invoked from ci.yml (workflow_call) so it
# participates in "all checks passed" on pull_request; skipped on push.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dependency-review:
    name: review deps
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          # MIT offline CLI: reject copyleft / non-OSI-friendly licenses on new deps.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0, SSPL-1.0, BUSL-1.1, CPOL-1.02
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, 0BSD,
            Unlicense, CC0-1.0, BlueOak-1.0.0, PostgreSQL, Zlib, BSL-1.0
