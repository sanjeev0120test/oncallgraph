name: fixtures

# Golden fixture + demo correctness. Parallel to ci; usually <45s.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: fixtures-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  golden:
    name: golden + demo
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Build + fixture gates
        run: |
          set -euo pipefail
          go build -trimpath -ldflags="-s -w" -o bin/opsgraph ./cmd/opsgraph
          ./bin/opsgraph test ./fixtures/incident_checkout
          ./bin/opsgraph validate-fixture ./fixtures/incident_checkout
          ./bin/opsgraph demo --format json >/dev/null
          # Determinism: same fixture ask twice must match byte-for-byte.
          ./bin/opsgraph ask checkout --fixture ./fixtures/incident_checkout --format json > /tmp/a.json
          ./bin/opsgraph ask checkout --fixture ./fixtures/incident_checkout --format json > /tmp/b.json
          cmp -s /tmp/a.json /tmp/b.json
