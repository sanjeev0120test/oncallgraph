name: release

# Automated secure delivery for every v* tag:
# - build 6 GOOS/GOARCH targets (no CGO)
# - package archives + LICENSE + installers + DEPENDENCIES + SHA256SUMS
# - attest provenance
# - publish a GitHub Release
#
# Precompiled binaries are NEVER committed to git; Releases are the only
# distribution channel for binaries.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build artifacts without publishing (always true for non-tag dispatch)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  build:
    name: build-release-binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Resolve version metadata
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
              echo "tag $VERSION does not look like a semver release (vX.Y.Z)" >&2
              exit 1
            fi
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Run unit + fixture gates before packaging
        run: |
          set -euo pipefail
          go test ./...
          go run ./cmd/opsgraph test ./fixtures/incident_checkout
          go run ./cmd/opsgraph demo --format json >/dev/null
      - name: Build multi-arch release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${{ steps.meta.outputs.version }}"
          COMMIT="${{ steps.meta.outputs.commit }}"
          DATE="${{ steps.meta.outputs.date }}"
          LDFLAGS="-s -w -X github.com/sanjeev0120test/opsgraph/internal/version.Version=${VERSION} -X github.com/sanjeev0120test/opsgraph/internal/version.Commit=${COMMIT} -X github.com/sanjeev0120test/opsgraph/internal/version.Date=${DATE}"
          pids=()
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${pair%/*}"
            GOARCH="${pair#*/}"
            out="dist/opsgraph_${VERSION}_${GOOS}_${GOARCH}"
            if [ "$GOOS" = windows ]; then out="${out}.exe"; fi
            echo "building $out"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "$LDFLAGS" -o "$out" ./cmd/opsgraph &
            pids+=($!)
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || exit 1
          done
          for f in dist/opsgraph_${VERSION}_*; do
            test -s "$f"
          done
          cd dist
          for f in opsgraph_${VERSION}_linux_* opsgraph_${VERSION}_darwin_*; do
            tar -czf "${f}.tar.gz" "$f"
            rm -f "$f"
          done
          for f in opsgraph_${VERSION}_windows_*.exe; do
            zip -q "${f%.exe}.zip" "$f"
            rm -f "$f"
          done
          cp ../LICENSE ./LICENSE
          cp ../scripts/install.sh ./install.sh
          cp ../scripts/install.ps1 ./install.ps1
          chmod +x install.sh
          (cd .. && go list -m all) > DEPENDENCIES.txt
          # SHA256SUMS must cover every file uploaded to the Release.
          sha256sum *.tar.gz *.zip LICENSE DEPENDENCIES.txt install.sh install.ps1 > SHA256SUMS
          test "$(grep -c . SHA256SUMS)" -eq 11
          sha256sum -c SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
      - name: Smoke-test linux/amd64 release archive
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          tmp="$(mktemp -d)"
          tar -xzf "dist/opsgraph_${VERSION}_linux_amd64.tar.gz" -C "$tmp"
          "$tmp/opsgraph_${VERSION}_linux_amd64" version | tee /tmp/opsgraph-version.txt
          grep -F "$VERSION" /tmp/opsgraph-version.txt
          "$tmp/opsgraph_${VERSION}_linux_amd64" ask checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
          "$tmp/opsgraph_${VERSION}_linux_amd64" doctor >/dev/null
      - name: Upload release assets (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: opsgraph-release-${{ steps.meta.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/DEPENDENCIES.txt
            dist/LICENSE
            dist/install.sh
            dist/install.ps1
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish-github-release
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.ref_type == 'tag' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run == 'false')
    steps:
      - uses: actions/checkout@v5
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: opsgraph-release-${{ needs.build.outputs.version }}
          path: dist
      - name: Verify release asset set
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          cd dist
          for f in \
            "opsgraph_${VERSION}_linux_amd64.tar.gz" \
            "opsgraph_${VERSION}_linux_arm64.tar.gz" \
            "opsgraph_${VERSION}_darwin_amd64.tar.gz" \
            "opsgraph_${VERSION}_darwin_arm64.tar.gz" \
            "opsgraph_${VERSION}_windows_amd64.zip" \
            "opsgraph_${VERSION}_windows_arm64.zip" \
            SHA256SUMS DEPENDENCIES.txt LICENSE install.sh install.ps1
          do
            test -s "$f"
          done
          sha256sum -c SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/DEPENDENCIES.txt
            dist/LICENSE
            dist/install.sh
            dist/install.ps1
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          generate_release_notes: true
          body: |
            ## opsgraph ${{ needs.build.outputs.version }}

            Precompiled binaries for **linux / darwin / windows × amd64 / arm64**.

            - Binaries are distributed **only** via GitHub Releases (never committed to the git source tree).
            - Verify downloads with `SHA256SUMS`.
            - Provenance attestation is attached to this release.
            - Installers: `install.sh` (Unix) and `install.ps1` (Windows).

            ```bash
            VERSION=${{ needs.build.outputs.version }}
            curl -fsSL "https://github.com/sanjeev0120test/opsgraph/releases/download/${VERSION}/install.sh" -o install.sh
            chmod +x install.sh
            OPSGRAPH_VERSION="$VERSION" ./install.sh
            ```
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/DEPENDENCIES.txt
            dist/LICENSE
            dist/install.sh
            dist/install.ps1
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
