name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  lint:
    name: lint (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: gofmt
        run: |
          fmtout="$(gofmt -l .)"
          if [ -n "$fmtout" ]; then echo "Unformatted files:"; echo "$fmtout"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          set -euo pipefail
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: default build compiles (no k8s.io linked)
        run: go build ./...
      - name: no release binaries committed to source tree
        run: |
          set -euo pipefail
          # Precompiled binaries/archives belong in GitHub Releases only.
          # Fail if any such path is tracked by git (bin/dist may exist locally as untracked).
          tracked="$(git ls-files -z | tr '\0' '\n' | grep -E '(^|/)(bin|dist)/|(^|/)opsgraph(\.exe)?$|(^|/)opsgraph_.+\.(tar\.gz|zip)$|(^|/)SHA256SUMS$|(^|/)DEPENDENCIES\.txt$' || true)"
          if [ -n "$tracked" ]; then
            echo "found tracked binary/archive artifacts; remove them and publish via Releases:" >&2
            echo "$tracked" >&2
            exit 1
          fi
          # Also reject accidental archive blobs under the tree that are untracked but present in the runner workspace from a bad commit attempt.
          if ls opsgraph_*.tar.gz opsgraph_*.zip 2>/dev/null | grep -q .; then
            echo "release archives present in workspace root; do not commit them" >&2
            exit 1
          fi

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: true
            smoke: full
          - os: macos-latest
            race: false
            smoke: compact
          - os: windows-latest
            race: false
            smoke: compact
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build binary
        run: go build -trimpath -ldflags="-s -w" -o bin/opsgraph ./cmd/opsgraph
      - name: Unit tests
        if: ${{ !matrix.race }}
        run: go test ./...
      - name: Unit tests (race)
        if: ${{ matrix.race }}
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: Fixture / golden + demo (built binary)
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/opsgraph
          if [ -f ./bin/opsgraph.exe ]; then BIN=./bin/opsgraph.exe; fi
          "$BIN" test ./fixtures/incident_checkout
          "$BIN" demo --format json >/dev/null
      - name: Compact CLI smoke (macos/windows)
        if: ${{ matrix.smoke == 'compact' }}
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/opsgraph
          if [ -f ./bin/opsgraph.exe ]; then BIN=./bin/opsgraph.exe; fi
          "$BIN" ask checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
          set +e
          "$BIN" ask nosuch --fixture ./fixtures/incident_checkout >/dev/null
          code=$?
          set -e
          test "$code" -eq 1
          "$BIN" path checkout-api auth --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" validate-fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" doctor >/dev/null
          DATA="$(mktemp -d)"
          "$BIN" ingest --fixture ./fixtures/incident_checkout --data-dir "$DATA" >/dev/null
          "$BIN" ask checkout --data-dir "$DATA" --format json >/dev/null
          "$BIN" ingest --fixture ./fixtures/incident_checkout --data-dir "$DATA" >/dev/null
      - name: Full CLI smoke (ubuntu)
        if: ${{ matrix.smoke == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/opsgraph
          if [ -f ./bin/opsgraph.exe ]; then BIN=./bin/opsgraph.exe; fi
          "$BIN" ask checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
          set +e
          "$BIN" ask nosuch --fixture ./fixtures/incident_checkout >/dev/null
          code=$?
          set -e
          test "$code" -eq 1
          set +e
          "$BIN" ask checkout >/dev/null
          code=$?
          set -e
          test "$code" -eq 2
          set +e
          "$BIN" verify-runbook checkout --fixture ./fixtures/incident_checkout >/dev/null
          code=$?
          set -e
          test "$code" -eq 1
          "$BIN" verify-runbook auth --fixture ./fixtures/incident_checkout >/dev/null
          set +e
          "$BIN" verify-runbook order --fixture ./fixtures/incident_checkout >/dev/null
          code=$?
          set -e
          test "$code" -eq 1
          "$BIN" verify-runbook ./fixtures/incident_checkout/runbooks/auth.md --fixture ./fixtures/incident_checkout >/dev/null
          DATA="$(mktemp -d)"
          "$BIN" ingest --fixture ./fixtures/incident_checkout --data-dir "$DATA" >/dev/null
          "$BIN" ask checkout --data-dir "$DATA" --format json >/dev/null
          "$BIN" status --data-dir "$DATA" >/dev/null
          "$BIN" status >/dev/null
          "$BIN" version >/dev/null
          "$BIN" ask checkout --fixture ./fixtures/incident_checkout --ai --format json >/dev/null
          "$BIN" services --fixture ./fixtures/incident_checkout --format json >/dev/null
          "$BIN" owners --fixture ./fixtures/incident_checkout --format json >/dev/null
          "$BIN" graph --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" graph --fixture ./fixtures/incident_checkout --format mermaid >/dev/null
          "$BIN" graph --fixture ./fixtures/incident_checkout --format table >/dev/null
          "$BIN" evidence ev-change-1 --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" explain checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" report checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" score checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
          "$BIN" who checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" compare checkout auth --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" timeline checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" path order auth --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" blast checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" doctor >/dev/null
          "$BIN" validate-fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" completion bash >/dev/null
          set +e
          "$BIN" watch checkout --fixture ./fixtures/incident_checkout --interval 1ms --timeout 5ms >/dev/null
          code=$?
          set -e
          test "$code" -eq 1
          "$BIN" health --fixture ./fixtures/incident_checkout --format json >/dev/null
          "$BIN" top --fixture ./fixtures/incident_checkout --format json >/dev/null
          "$BIN" resolve checkout-api --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" changes --fixture ./fixtures/incident_checkout --service checkout --since 2h >/dev/null
          "$BIN" alerts --fixture ./fixtures/incident_checkout --firing >/dev/null
          "$BIN" impact auth --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" fingerprint checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" why checkout --fixture ./fixtures/incident_checkout >/dev/null
          EXP="$(mktemp -d)"
          "$BIN" export checkout --fixture ./fixtures/incident_checkout --format markdown --out "$EXP/r.md" >/dev/null
          test -s "$EXP/r.md"
          CFGDIR="$(mktemp -d)"
          cp .opsgraph.example.yaml "$CFGDIR/.opsgraph.yaml"
          BIN_ABS="$(pwd)/bin/opsgraph"
          (cd "$CFGDIR" && "$BIN_ABS" doctor --config .opsgraph.yaml >/dev/null)

  install:
    name: install-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go install (GOBIN on PATH)
        shell: bash
        run: |
          set -euo pipefail
          go install ./cmd/opsgraph
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify installation
        shell: bash
        run: |
          set -euo pipefail
          command -v opsgraph
          opsgraph version
          opsgraph doctor
          opsgraph demo --format json >/dev/null
          opsgraph validate-fixture ./fixtures/incident_checkout >/dev/null
          opsgraph ask checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
      - name: install.ps1 from local dist (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -o dist/opsgraph-windows-amd64.exe ./cmd/opsgraph
          $installDir = Join-Path $env:RUNNER_TEMP "opsgraph-install"
          $env:OPSGRAPH_DIST_DIR = (Resolve-Path dist).Path
          $env:OPSGRAPH_INSTALL_DIR = $installDir
          ./scripts/install.ps1
          & "$installDir/opsgraph.exe" version
          & "$installDir/opsgraph.exe" ask checkout --fixture ./fixtures/incident_checkout --format json | Out-Null

  cross:
    name: cross-compile (6 targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Cross-compile linux/darwin/windows × amd64/arm64
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="ci-${GITHUB_SHA::7}"
          LDFLAGS="-s -w -X github.com/sanjeev0120test/opsgraph/internal/version.Version=${VERSION} -X github.com/sanjeev0120test/opsgraph/internal/version.Commit=${GITHUB_SHA} -X github.com/sanjeev0120test/opsgraph/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pids=()
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${pair%/*}"
            GOARCH="${pair#*/}"
            out="dist/opsgraph-${GOOS}-${GOARCH}"
            if [ "$GOOS" = windows ]; then out="${out}.exe"; fi
            echo "building $out"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "$LDFLAGS" -o "$out" ./cmd/opsgraph &
            pids+=($!)
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || exit 1
          done
          for f in dist/opsgraph-*; do
            test -s "$f"
          done
          test "$(ls dist/opsgraph-* | wc -l)" -eq 6
          ls -la dist
          ./dist/opsgraph-linux-amd64 version
          ./dist/opsgraph-linux-amd64 doctor
      - name: Test scripts/install.sh from local dist
        run: |
          set -euo pipefail
          chmod +x scripts/install.sh
          INSTALL_DIR="$(mktemp -d)"
          OPSGRAPH_DIST_DIR="$PWD/dist" OPSGRAPH_INSTALL_DIR="$INSTALL_DIR" ./scripts/install.sh
          "$INSTALL_DIR/opsgraph" version
          "$INSTALL_DIR/opsgraph" ask checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
      - name: Simulate full release packaging + checksums
        run: |
          set -euo pipefail
          VERSION="v0.0.0-ci"
          mkdir -p dist-release
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${pair%/*}"
            GOARCH="${pair#*/}"
            src="dist/opsgraph-${GOOS}-${GOARCH}"
            if [ "$GOOS" = windows ]; then src="${src}.exe"; fi
            dst="dist-release/opsgraph_${VERSION}_${GOOS}_${GOARCH}"
            if [ "$GOOS" = windows ]; then dst="${dst}.exe"; fi
            cp "$src" "$dst"
          done
          cd dist-release
          for f in opsgraph_${VERSION}_linux_* opsgraph_${VERSION}_darwin_*; do
            tar -czf "${f}.tar.gz" "$f"
            rm -f "$f"
          done
          for f in opsgraph_${VERSION}_windows_*.exe; do
            zip -q "${f%.exe}.zip" "$f"
            rm -f "$f"
          done
          cp ../LICENSE ./LICENSE
          cp ../scripts/install.sh ./install.sh
          cp ../scripts/install.ps1 ./install.ps1
          chmod +x install.sh
          (cd .. && go list -m all) > DEPENDENCIES.txt
          # Checksums cover EVERY published file (archives + installers + metadata).
          sha256sum *.tar.gz *.zip LICENSE DEPENDENCIES.txt install.sh install.ps1 > SHA256SUMS
          test "$(grep -c . SHA256SUMS)" -eq 11
          sha256sum -c SHA256SUMS
          tar -tzf "opsgraph_${VERSION}_linux_amd64.tar.gz" | grep -qx "opsgraph_${VERSION}_linux_amd64"
          tmp="$(mktemp -d)"
          tar -xzf "opsgraph_${VERSION}_linux_amd64.tar.gz" -C "$tmp"
          "$tmp/opsgraph_${VERSION}_linux_amd64" version
          "$tmp/opsgraph_${VERSION}_linux_amd64" ask checkout --fixture ../fixtures/incident_checkout --format json >/dev/null
      - name: Upload cross-compile artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: opsgraph-cross-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # Single green signal for branch protection / required checks.
  ci-ok:
    name: all checks passed
    needs: [lint, test, install, cross]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Aggregate job results
        run: |
          set -euo pipefail
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "install=${{ needs.install.result }}"
          echo "cross=${{ needs.cross.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.install.result }}" = "success"
          test "${{ needs.cross.result }}" = "success"
          echo "all required CI jobs passed"
