name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  lint:
    name: lint (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: gofmt
        run: |
          fmtout="$(gofmt -l .)"
          if [ -n "$fmtout" ]; then echo "Unformatted files:"; echo "$fmtout"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: default build compiles (no k8s.io linked)
        run: go build ./...

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: true
          - os: macos-latest
            race: true
          - os: windows-latest
            race: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build binary
        run: go build -o bin/oncallgraph ./cmd/oncallgraph
      - name: Unit tests
        if: ${{ !matrix.race }}
        run: go test ./...
      - name: Unit tests (race)
        if: ${{ matrix.race }}
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: Fixture / golden tests
        run: go run ./cmd/oncallgraph test ./fixtures/incident_checkout
      - name: Demo (no kube/AI/Docker)
        run: go run ./cmd/oncallgraph demo --format json
      - name: CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/oncallgraph
          if [ -f ./bin/oncallgraph.exe ]; then BIN=./bin/oncallgraph.exe; fi
          "$BIN" ask checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
          set +e
          "$BIN" ask nosuch --fixture ./fixtures/incident_checkout >/dev/null
          code=$?
          set -e
          test "$code" -eq 1
          set +e
          "$BIN" ask checkout >/dev/null
          code=$?
          set -e
          test "$code" -eq 2
          set +e
          "$BIN" verify-runbook checkout --fixture ./fixtures/incident_checkout >/dev/null
          code=$?
          set -e
          test "$code" -eq 1
          "$BIN" verify-runbook auth --fixture ./fixtures/incident_checkout >/dev/null
          set +e
          "$BIN" verify-runbook order --fixture ./fixtures/incident_checkout >/dev/null
          code=$?
          set -e
          test "$code" -eq 1
          "$BIN" verify-runbook ./fixtures/incident_checkout/runbooks/auth.md --fixture ./fixtures/incident_checkout >/dev/null
          DATA="$(mktemp -d)"
          "$BIN" ingest --fixture ./fixtures/incident_checkout --data-dir "$DATA" >/dev/null
          "$BIN" ask checkout --data-dir "$DATA" --format json >/dev/null
          "$BIN" status --data-dir "$DATA" >/dev/null
          "$BIN" status >/dev/null
          "$BIN" version >/dev/null
          "$BIN" ask checkout --fixture ./fixtures/incident_checkout --ai --format json >/dev/null
          "$BIN" services --fixture ./fixtures/incident_checkout --format json >/dev/null
          "$BIN" owners --fixture ./fixtures/incident_checkout --format json >/dev/null
          "$BIN" graph --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" graph --fixture ./fixtures/incident_checkout --format mermaid >/dev/null
          "$BIN" evidence ev-change-1 --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" explain checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" report checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" score checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
          "$BIN" who checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" compare checkout auth --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" timeline checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" path order auth --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" blast checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" doctor >/dev/null
          "$BIN" validate-fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" completion bash >/dev/null
          set +e
          "$BIN" watch checkout --fixture ./fixtures/incident_checkout --interval 1ms --timeout 5ms >/dev/null
          code=$?
          set -e
          test "$code" -eq 1
          # world-class feature smoke
          "$BIN" health --fixture ./fixtures/incident_checkout --format json >/dev/null
          "$BIN" top --fixture ./fixtures/incident_checkout --format json >/dev/null
          "$BIN" resolve checkout-api --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" changes --fixture ./fixtures/incident_checkout --service checkout >/dev/null
          "$BIN" alerts --fixture ./fixtures/incident_checkout --firing >/dev/null
          "$BIN" impact auth --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" fingerprint checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" why checkout --fixture ./fixtures/incident_checkout >/dev/null
          EXP="$(mktemp -d)"
          "$BIN" export checkout --fixture ./fixtures/incident_checkout --format markdown --out "$EXP/r.md" >/dev/null
          test -s "$EXP/r.md"

  install:
    name: install-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go install (GOBIN on PATH)
        shell: bash
        run: |
          set -euo pipefail
          go install ./cmd/oncallgraph
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify installation
        shell: bash
        run: |
          set -euo pipefail
          command -v oncallgraph
          oncallgraph version
          oncallgraph doctor
          oncallgraph demo --format json >/dev/null
          oncallgraph validate-fixture ./fixtures/incident_checkout >/dev/null
          oncallgraph ask checkout --fixture ./fixtures/incident_checkout --format json >/dev/null

  cross:
    name: cross-compile (6 targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Cross-compile linux/darwin/windows × amd64/arm64
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="ci-${GITHUB_SHA::7}"
          LDFLAGS="-s -w -X github.com/sanjeev0120test/oncallgraph/internal/version.Version=${VERSION} -X github.com/sanjeev0120test/oncallgraph/internal/version.Commit=${GITHUB_SHA} -X github.com/sanjeev0120test/oncallgraph/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${pair%/*}"
            GOARCH="${pair#*/}"
            out="dist/oncallgraph-${GOOS}-${GOARCH}"
            if [ "$GOOS" = windows ]; then out="${out}.exe"; fi
            echo "building $out"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -ldflags "$LDFLAGS" -o "$out" ./cmd/oncallgraph
            test -s "$out"
          done
          ls -la dist
          # Smoke-run the linux/amd64 artifact on the runner.
          ./dist/oncallgraph-linux-amd64 version
          ./dist/oncallgraph-linux-amd64 doctor
      - name: Test scripts/install.sh from local dist
        run: |
          set -euo pipefail
          chmod +x scripts/install.sh
          INSTALL_DIR="$(mktemp -d)"
          ONCALLGRAPH_DIST_DIR="$PWD/dist" ONCALLGRAPH_INSTALL_DIR="$INSTALL_DIR" ./scripts/install.sh
          "$INSTALL_DIR/oncallgraph" version
          "$INSTALL_DIR/oncallgraph" ask checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
      - name: Upload cross-compile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oncallgraph-cross-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  kind-integration:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: kind demo script present
        run: test -f hack/kind-demo.sh
      - name: (disabled) run kind demo
        run: bash hack/kind-demo.sh
