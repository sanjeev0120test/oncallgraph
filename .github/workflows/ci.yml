name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: lint (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: gofmt
        run: |
          fmtout="$(gofmt -l .)"
          if [ -n "$fmtout" ]; then echo "Unformatted files:"; echo "$fmtout"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: default build compiles (no k8s.io linked)
        run: CGO_ENABLED=0 go build ./...

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: true
          - os: macos-latest
            race: true
          - os: windows-latest
            race: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build binary
        run: go build -o bin/opsgraph ./cmd/opsgraph
      - name: Unit tests
        if: ${{ !matrix.race }}
        run: go test ./...
      - name: Unit tests (race)
        if: ${{ matrix.race }}
        run: go test -race ./...
      - name: Fixture / golden tests
        run: go run ./cmd/opsgraph test ./fixtures/incident_checkout
      - name: Demo (no kube/AI/Docker)
        run: go run ./cmd/opsgraph demo --format json

  # Phase-2 only; kept disabled so default CI stays clusterless and secret-free.
  kind-integration:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "kind integration placeholder"
