name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: lint (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: gofmt
        run: |
          fmtout="$(gofmt -l .)"
          if [ -n "$fmtout" ]; then echo "Unformatted files:"; echo "$fmtout"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: default build compiles (no k8s.io linked)
        env:
          CGO_ENABLED: "0"
        run: go build ./...

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: true
          - os: macos-latest
            race: true
          - os: windows-latest
            race: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build binary
        env:
          CGO_ENABLED: "0"
        run: go build -o bin/opsgraph ./cmd/opsgraph
      - name: Unit tests
        if: ${{ !matrix.race }}
        run: go test ./...
      - name: Unit tests (race)
        if: ${{ matrix.race }}
        # -race needs cgo; keep product builds CGO_ENABLED=0 above.
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: Fixture / golden tests
        run: go run ./cmd/opsgraph test ./fixtures/incident_checkout
      - name: Demo (no kube/AI/Docker)
        run: go run ./cmd/opsgraph demo --format json
      - name: CLI smoke (ask + verify-runbook exit codes)
        shell: bash
        run: |
          set -euo pipefail
          # ask success even when runbook is stale
          go run ./cmd/opsgraph ask checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
          # ask unknown service => 1
          set +e
          go run ./cmd/opsgraph ask nosuch --fixture ./fixtures/incident_checkout >/dev/null
          code=$?
          set -e
          test "$code" -eq 1
          # ask with no data source => 2
          set +e
          go run ./cmd/opsgraph ask checkout >/dev/null
          code=$?
          set -e
          test "$code" -eq 2
          # stale runbook => exit 1
          set +e
          go run ./cmd/opsgraph verify-runbook checkout --fixture ./fixtures/incident_checkout >/dev/null
          code=$?
          set -e
          test "$code" -eq 1
          # healthy auth runbook => exit 0
          go run ./cmd/opsgraph verify-runbook auth --fixture ./fixtures/incident_checkout >/dev/null
          # missing runbook => exit 2
          set +e
          go run ./cmd/opsgraph verify-runbook order --fixture ./fixtures/incident_checkout >/dev/null
          code=$?
          set -e
          test "$code" -eq 2
          # verify by file path => exit 0
          go run ./cmd/opsgraph verify-runbook ./fixtures/incident_checkout/runbooks/auth.md --fixture ./fixtures/incident_checkout >/dev/null
          # status / version smoke
          go run ./cmd/opsgraph status >/dev/null
          go run ./cmd/opsgraph version >/dev/null

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Cross-compile release targets
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${pair%/*}"
            GOARCH="${pair#*/}"
            out="dist/opsgraph-${GOOS}-${GOARCH}"
            if [ "$GOOS" = windows ]; then out="${out}.exe"; fi
            echo "building $out"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -o "$out" ./cmd/opsgraph
          done
          ls -la dist

  # Phase-2 only; kept disabled so default CI stays clusterless and secret-free.
  # Enable locally with: bash hack/kind-demo.sh (needs docker + kind + kubectl).
  kind-integration:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: kind demo script present
        run: test -f hack/kind-demo.sh
      - name: (disabled) run kind demo
        run: bash hack/kind-demo.sh
