name: license

# License + distribution hygiene. Parallel; usually <20s.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: license-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  hygiene:
    name: MIT + no committed binaries
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check LICENSE and ignore rules
        run: |
          set -euo pipefail
          test -s LICENSE
          grep -qi 'MIT License' LICENSE
          # Distribution policy: release artifacts must not be tracked.
          tracked="$(git ls-files -z | tr '\0' '\n' | grep -E '(^|/)(bin|dist)/|\.exe$|\.tar\.gz$|\.zip$|(^|/)SHA256SUMS$' || true)"
          if [ -n "$tracked" ]; then
            echo "tracked distributable artifacts found:" >&2
            echo "$tracked" >&2
            exit 1
          fi
          # Installers must exist for Releases.
          test -s scripts/install.sh
          test -s scripts/install.ps1
          head -n 1 scripts/install.sh | grep -qE '^#!/'
