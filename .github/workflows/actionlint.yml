name: actionlint

# Lint workflow YAML. Invoked from ci.yml (+ manual dispatch).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  actionlint:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true
          shellcheck: true
          pyflakes: false
