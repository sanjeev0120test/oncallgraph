name: Setup Go
description: Fast, Node-24-ready Go toolchain setup with module cache
inputs:
  cache:
    description: Enable module cache (disable for publish-capable release builds)
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
        cache: ${{ inputs.cache == 'true' }}
        cache-dependency-path: go.sum
        check-latest: false
